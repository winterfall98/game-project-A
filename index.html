<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Attention Not Included</title>
  <link rel="stylesheet" href="/src/ui/styles.css" />
  <style>html,body{margin:0;padding:0;width:100%;height:100%;overflow:hidden;}</style>
</head>
<body>
  <div id="intro-screen">
    <h1 class="game-title">Attention Not Included</h1>
    <p class="game-subtitle">집중력 미포함</p>
    <button id="btn-start" class="btn btn-start">시작</button>
    <button id="btn-options" class="btn btn-options">설정</button>
    <div id="options-panel" class="options-overlay">
      <div class="options-box">
        <div class="options-title">설정</div>
        <div class="option-group">
          <span class="option-label">이동 방식</span>
          <div class="radio-group">
            <label><input type="radio" name="controlMode" value="arrows" checked /> 방향키</label>
            <label><input type="radio" name="controlMode" value="wasd" /> WASD</label>
          </div>
        </div>
        <div class="option-group">
          <span class="option-label">구르기 키</span>
          <div class="radio-group">
            <label><input type="radio" name="dodgeKey" value="SHIFT" checked /> Shift</label>
            <label><input type="radio" name="dodgeKey" value="SPACE" /> Space</label>
          </div>
        </div>
        <div class="option-group">
          <span class="option-label">폭탄 키</span>
          <div class="option-row">키보드: <strong>Y</strong> (고정)</div>
        </div>
        <div class="option-group">
          <label class="option-label">모바일 모드</label>
          <div class="option-row">
            <label><input type="checkbox" id="opt-mobile" /> 터치 조작 사용</label>
          </div>
          <div id="mobile-scale-row" class="option-row" style="display:none;">
            <label>조작 버튼 크기: <span id="scale-value">1.0</span></label>
            <input type="range" id="opt-scale" min="0.7" max="1.3" step="0.1" value="1.0" />
          </div>
        </div>
        <div class="options-actions">
          <button id="btn-options-save" class="btn-save">저장</button>
          <button id="btn-options-cancel" class="btn-cancel">취소</button>
        </div>
      </div>
    </div>
  </div>
  <div id="game-container"></div>
  <div id="result-screen" style="display:none;"></div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
